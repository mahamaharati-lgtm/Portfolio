name: developer-portfolio

on:
  push:
    branches: [main]
    paths: ['developer-portfolio/**', '.github/workflows/developer-portfolio.yml']
  pull_request:
    paths: ['developer-portfolio/**', '.github/workflows/developer-portfolio.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: developer-portfolio

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: developer-portfolio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: developer-portfolio-playwright-report
          path: |
            developer-portfolio/test-results
          retention-days: 7
